services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ynov-portainer
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: always

  db:
    image: postgres:15-alpine
    container_name: ynov-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ynov-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ynov-redis
    networks:
      - ynov-net
    restart: unless-stopped

  s3storage:
    image: dxflrs/garage:v1.0.1
    container_name: ynov-s3
    ports:
      - "3900:3900" # API S3
    volumes:
      - s3-data:/data
    networks:
      - ynov-net
    restart: unless-stopped

  streaming:
    build: ./streaming
    container_name: ynov-streaming
    ports:
      - "8080:80"
    depends_on:
      - s3storage
    networks:
      - ynov-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ynov-frontend
    ports:
      - "3000:80"
    networks:
      - ynov-net
    restart: unless-stopped

  worker:
    build: ./worker
    container_name: ynov-worker
    environment:
      - REDIS_HOST=redis
      - S3_HOST=s3storage:3900
    depends_on:
      - redis
      - s3storage
    networks:
      - ynov-net
    restart: unless-stopped

volumes:
  portainer-data:
  db-data:
  s3-data:

networks:
  ynov-net:
    driver: bridge