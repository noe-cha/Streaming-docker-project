services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: ynov-arcane
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - APP_URL=http://localhost:3552
    networks:
      - ynov-net
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ynov-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ynov-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ynov-redis
    networks:
      - ynov-net
    restart: unless-stopped

  s3storage:
    image: dxflrs/garage:v2.4.0
    container_name: ynov-s3
    volumes:
      - s3-data:/data
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
    ports:
      - "3900:3900"
    networks:
      - ynov-net
    restart: unless-stopped

  streaming:
    build: ./streaming
    container_name: ynov-streaming
    ports:
      - "8080:80"
    depends_on:
      - s3storage
    networks:
      - ynov-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ynov-frontend
    ports:
      - "3000:80"
    networks:
      - ynov-net
    restart: unless-stopped

  worker:
    build: ./worker
    container_name: ynov-worker
    environment:
      - REDIS_HOST=redis
      - S3_HOST=s3storage:3900
    depends_on:
      - redis
      - s3storage
    networks:
      - ynov-net
    restart: unless-stopped

volumes:
  arcane-data:
  db-data:
  s3-data:

networks:
  ynov-net:
    driver: bridge