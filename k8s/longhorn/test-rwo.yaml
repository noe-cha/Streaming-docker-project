apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-rwo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-writer
spec:
  containers:
    - name: c
      image: busybox:1.37
      command: ["sh", "-c", "echo \"écrit le $(date)\" >> /data/log.txt; sleep 36000"]
      volumeMounts:
        - name: d
          mountPath: /data
  volumes:
    - name: d
      persistentVolumeClaim:
        claimName: test-rwo
