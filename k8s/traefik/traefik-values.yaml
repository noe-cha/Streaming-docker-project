deployment:
  replicas: 2

service:
  # IP fixe attribuée par MetalLB (sinon MetalLB prend la première libre)
  annotations:
    metallb.io/loadBalancerIPs: 192.168.100.201
  spec:
    type: LoadBalancer

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true
