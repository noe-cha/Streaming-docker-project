deployment:
  replicas: 2

service:
  spec:
   type: LoadBalancer

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true

# IP fixe attribuée par MetalLB (sinon MetalLB prend la première libre)
service:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.100.201
