server {
    listen 80;
    
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';

    location / {
        proxy_pass http://s3storage:3900/videos/;
        proxy_set_header Host $http_host;
        
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        
        proxy_buffering off;
    }
}