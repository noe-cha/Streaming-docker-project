name: CI/CD Pipeline Jellyfin

on:
  push:
    branches: [ "main" ]

jobs:
  integration-et-deploiement:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: CI - Compilation image (docker build)
        run: docker compose build 

      - name: CI - Scan avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      - name: CD - Connexion SSH et déploiement
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /Streaming-docker-project
            git pull origin main
            
            echo "--- Vérification installation Docker ---"
            docker --version
            docker compose version
            
            echo "--- Déploiement du docker-compose.yml ---"
            docker compose up -d --build --force-recreate
            
            echo "--- Vérification des healthcheck ---"
            sleep 15
            docker compose ps
            docker ps --format "table {{.Names}}\t{{.Status}}"