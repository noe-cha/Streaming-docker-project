name: CI/CD Pipeline Jellyfin

# 1. Créer le déclencheur (Push)
on:
  push:
    branches: [ "main" ]

jobs:
  integration-et-deploiement:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. CI : Compilation image (docker build)
      - name: CI - Compilation image (docker build)
        run: docker compose pull

      # 3. CI : Scan avec Trivy
      - name: CI - Scan avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

      # 4. CD : Connexion SSH avec clé SSH (Deploy Key)
      - name: CD - Connexion SSH et exécution
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
